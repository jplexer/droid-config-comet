; Hardware features of the Google Pixel 9 Pro Fold (comet), read by
; DeviceInfo (status bar battery, Settings pages) and CSD (hardware tests).
; Features that do not work on the port yet are 0 so the UI does not offer
; them; switch them on once they are supported.

[features]
AudioMic1=1
AudioMic2=0
BackCamera=0
BackCameraFlash=0
Backlight=1
Battery=1
Bluetooth=0
BluetoothTethering=0
Cellular5G=0
CellularData=0
CellularVoice=0
CellInfo=0
ECompass=0
FmRadio=0
FrontCamera=0
FrontCameraFlash=0
GPS=0
GSensor=0
Gyro=0
; fold state (hall_sensor), used by comet-fold-watch
Hall=1
Fingerprint=0
; USB-C only, no 3.5 mm jack
Headset=0
Key=1
LCD=1
LED=0
LightSensor=0
Loudspeaker=1
TOH=0
ProxSensor=0
Receiver=1
SDCard=0
SIM=0
StereoLoudspeaker=1
Touch=1
TouchAuto=0
UsbCharging=1
UsbOtg=0
; haptics: cs40l26 firmware is requested before /vendor is mounted
Vibrator=0
Wifi=1

[Battery]
VoltageTest=False
