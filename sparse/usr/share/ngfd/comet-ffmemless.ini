# Haptic effects for the Cirrus Logic CS40L26 on comet. The chip only plays
# waveforms from its wavetable: bank 0 (RAM), indices as in Pixel's vibrator
# HAL: 0 long vibration (length = _DURATION), 2 click, 3 short vibration,
# 4 thud, 9 light tick, 10 low tick. Needs ngfd with _CUSTOM_BANK support.
[ffmemless]
default_custom_bank = 0
default_custom_index = 2

touch_TYPE = periodic
touch_WAVEFORM = custom
touch_CUSTOM_BANK = 0
touch_CUSTOM = 9
touch_DURATION = 20

touch_weak_TYPE = periodic
touch_weak_WAVEFORM = custom
touch_weak_CUSTOM_BANK = 0
touch_weak_CUSTOM = 10
touch_weak_DURATION = 20

touch_strong_TYPE = periodic
touch_strong_WAVEFORM = custom
touch_strong_CUSTOM_BANK = 0
touch_strong_CUSTOM = 2
touch_strong_DURATION = 30

release_TYPE = periodic
release_WAVEFORM = custom
release_CUSTOM_BANK = 0
release_CUSTOM = 9
release_DURATION = 20

release_weak_TYPE = periodic
release_weak_WAVEFORM = custom
release_weak_CUSTOM_BANK = 0
release_weak_CUSTOM = 10
release_weak_DURATION = 20

release_strong_TYPE = periodic
release_strong_WAVEFORM = custom
release_strong_CUSTOM_BANK = 0
release_strong_CUSTOM = 2
release_strong_DURATION = 30

drag_start_TYPE = periodic
drag_start_WAVEFORM = custom
drag_start_CUSTOM_BANK = 0
drag_start_CUSTOM = 10
drag_start_DURATION = 20

drag_fail_TYPE = periodic
drag_fail_WAVEFORM = custom
drag_fail_CUSTOM_BANK = 0
drag_fail_CUSTOM = 4
drag_fail_DURATION = 40

short_TYPE = periodic
short_WAVEFORM = custom
short_CUSTOM_BANK = 0
short_CUSTOM = 2
short_DURATION = 30

strong_TYPE = periodic
strong_WAVEFORM = custom
strong_CUSTOM_BANK = 0
strong_CUSTOM = 4
strong_DURATION = 60

long_TYPE = periodic
long_WAVEFORM = custom
long_CUSTOM_BANK = 0
long_CUSTOM = 0
long_DURATION = 400

notice_TYPE = periodic
notice_WAVEFORM = custom
notice_CUSTOM_BANK = 0
notice_CUSTOM = 0
notice_DURATION = 150

message_TYPE = periodic
message_WAVEFORM = custom
message_CUSTOM_BANK = 0
message_CUSTOM = 0
message_DURATION = 300

attention_TYPE = periodic
attention_WAVEFORM = custom
attention_CUSTOM_BANK = 0
attention_CUSTOM = 0
attention_DURATION = 600

alarm_TYPE = periodic
alarm_WAVEFORM = custom
alarm_CUSTOM_BANK = 0
alarm_CUSTOM = 0
alarm_DURATION = 1000

ringtone_TYPE = periodic
ringtone_WAVEFORM = custom
ringtone_CUSTOM_BANK = 0
ringtone_CUSTOM = 0
ringtone_DURATION = 1000
touch_DIRECTION = none
touch_weak_DIRECTION = none
touch_strong_DIRECTION = none
release_DIRECTION = none
release_weak_DIRECTION = none
release_strong_DIRECTION = none
drag_start_DIRECTION = none
drag_fail_DIRECTION = none
short_DIRECTION = none
strong_DIRECTION = none
long_DIRECTION = none
notice_DIRECTION = none
message_DIRECTION = none
attention_DIRECTION = none
alarm_DIRECTION = none
ringtone_DIRECTION = none
alarm_DELAY = 1000
ringtone_DELAY = 1000
