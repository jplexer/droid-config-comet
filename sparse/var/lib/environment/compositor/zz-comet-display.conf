# Pixel 9 Pro Fold: hall sensor 1 = open -> inner display 0 (panel mounted
# rotated, native 2152x2076), 0 = closed -> outer display 1.
# Needs qt5-qpa-hwcomposer-plugin with QPA_HWC_DISPLAY_SWITCH.
QPA_HWC_DISPLAY_SWITCH_FILE=/sys/devices/platform/hall_sensor/state
QPA_HWC_DISPLAY_SWITCH=1=0@90,0=1@0
