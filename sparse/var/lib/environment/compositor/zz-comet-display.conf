# Pixel 9 Pro Fold: use the inner display (HWC display 0). Its panel is
# mounted rotated (native 2152x2076), so the output is rotated; the touch
# controller already reports portrait coordinates and needs no rotation.
# Needs qt5-qpa-hwcomposer-plugin with QPA_HWC_DISPLAY_ID/QPA_HWC_ROTATION.
QPA_HWC_DISPLAY_ID=0
QPA_HWC_ROTATION=90
