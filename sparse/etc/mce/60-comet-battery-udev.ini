# Pixel 9 Pro Fold exposes many helper power supply devices. dc-mains reports
# present=1 permanently, which mce takes as a connected charger, so the UI
# keeps showing "charging" after the cable is unplugged. Track only "battery"
# and "usb"; a configured blacklist replaces mce's built-in one, so it is
# repeated here.
[BatteryUDevDeviceBlacklist]
bcl=true
bms=true
dc=true
fg_adc=true
main=true
parallel=true
pc_port=true
pm8921-dc=true
dc-mains=true
dualbatt=true
gcpm=true
gcpm_pps=true
main-charger=true
maxfg_base=true
maxfg_secondary=true
tcpm-source-psy-i2c-max77759tcpc=true
wireless=true
