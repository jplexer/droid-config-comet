# bcmdhd creates wlan0, wlan1 and aware_nmi0 on the same phy. Only wlan0 is
# meant for station mode: scanning on all three lists every network three
# times, and connecting through wlan1/aware_nmi0 makes bcmdhd dereference
# NULL in wl_cfg80211_disconnect (kernel panic).
[General]
NetworkInterfaceBlacklist = ifb,p2p,usb,rmnet,rev_rmnet,wlan1,aware
